apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claimdb
  labels:
    app: claimdb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: claimdb
  labels:
    app: claimdb
stringData:
  database-name: claimdb
  database-user: claimdb
  database-password: claimdb
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: claimdb
  labels:
    app: claimdb
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: claimdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimdb
  labels:
    app: claimdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claimdb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: claimdb
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-name
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/libexec/check-container", "--live"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: claimdb
