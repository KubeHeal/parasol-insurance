apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-app
  labels:
    app: ic-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic-app
  template:
    metadata:
      labels:
        app: ic-app
        deployment: ic-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: insurance-claim-app
          image: quay.io/rh-aiservices-bu/rhoai-lab-insurance-claim-app:2.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
              name: http
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFERENCE_SERVER_URL
              value: http://qwen-predictor.parasol-insurance.svc.cluster.local:80/v1
            - name: MODEL_NAME
              value: qwen2.5
            - name: MAX_TOKENS
              value: "512"
            - name: TOP_P
              value: "0.95"
            - name: TEMPERATURE
              value: "0.01"
            - name: PRESENCE_PENALTY
              value: "1.03"
            - name: POSTGRES_HOST
              value: claimdb
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-password
            - name: POSTGRES_PORT
              value: "5432"
            - name: S3_ENDPOINT_URL
              value: http://minio:9000
            - name: IMAGES_BUCKET
              value: claim-images
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: secret-minio
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-minio
                  key: aws_secret_access_key
            - name: MILVUS_HOST
              value: milvus.parasol-insurance.svc.cluster.local
            - name: MILVUS_PORT
              value: "19530"
            - name: MILVUS_USERNAME
              value: root
            - name: MILVUS_PASSWORD
              value: Milvus
            - name: SCORE_THRESHOLD
              value: "0.90"
            - name: MILVUS_COLLECTION
              value: california_driver_handbook_1_0
            - name: MAX_RETRIEVED_DOCS
              value: "4"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
