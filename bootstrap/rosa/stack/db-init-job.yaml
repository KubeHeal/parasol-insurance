apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-name
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimdb
                  key: database-password
            - name: POSTGRESQL_DATABASE_HOST
              value: claimdb
          command: ["/bin/bash", "-c"]
          args:
            - |
              until pg_isready -h "$POSTGRESQL_DATABASE_HOST" -p 5432; do
                echo "Waiting for claimdb"
                sleep 2
              done
              psql -h "$POSTGRESQL_DATABASE_HOST" -p 5432 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -v ON_ERROR_STOP=1 -f /sql-script/script.sql
          volumeMounts:
            - name: sql-script-volume
              mountPath: /sql-script
      volumes:
        - name: sql-script-volume
          configMap:
            name: sql-script-configmap
