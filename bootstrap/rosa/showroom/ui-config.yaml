apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-ui-config
data:
  ui-config.yml: |
    ---
    type: showroom
    default_width: 30
    persist_url_state: true

    view_switcher:
      enabled: true
      default_mode: split

    tabs:
      - name: ">_ terminal"
        url: /terminal
      - name: Wetty
        url: /wetty/
      - name: OCP Console
        url: https://console-openshift-console.apps.c9d0l4o7y2h5y5j.j2et.p1.openshiftapps.com
