---
# Source: showroom-single-pod/templates/terminal/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showroom
  namespace: showroom

---
# Source: showroom-single-pod/templates/proxy/configmap-traefik-dynamic.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-traefik-dynamic
  namespace: showroom
data:
  dynamic.yml: |
    http:
      routers:
        showroom:
          rule: "PathPrefix(`/`)"
          entryPoints:
            - web
          service: showroom
          priority: 1
        terminal:
          rule: "PathPrefix(`/terminal`)"
          entryPoints:
            - web
          service: terminal
          middlewares:
            - terminal-stripprefix
          priority: 10
        wetty:
          rule: "PathPrefix(`/wetty`)"
          entryPoints:
            - web
          service: wetty
          priority: 10

      services:
        showroom:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8000"
        terminal:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:7681"
        wetty:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8001"
      middlewares:
        terminal-stripprefix:
          stripPrefix:
            prefixes:
              - "/terminal"

---
# Source: showroom-single-pod/templates/proxy/configmap-traefik-static.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-traefik-static
  namespace: showroom
data:
  traefik.yml: |
    api:
      dashboard: false
      insecure: false
    entryPoints:
      web:
        address: ":8080"
    ping:
      entryPoint: web
    providers:
      file:
        filename: /etc/traefik/dynamic.yml
        watch: false
    log:
      level: INFO
    accessLog: {}
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

---
# Source: showroom-single-pod/templates/proxy/configmap-user-data.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-userdata
  namespace: showroom
data:
  user_data.yml: |
    bastion_password: from_helm
    user: cluster-admin
    guid: rosa
    password: "Run rosa describe admin -c aiops-platform-lab for the login command. The password was printed once by rosa create admin and cannot be retrieved. If it was not saved, rosa delete admin and rosa create admin print a new one."
    openshift_cluster_ingress_domain: apps.c9d0l4o7y2h5y5j.j2et.p1.openshiftapps.com
    openshift_console_url: https://console-openshift-console.apps.c9d0l4o7y2h5y5j.j2et.p1.openshiftapps.com
    rhoai_dashboard_url: https://rhods-dashboard-redhat-ods-applications.apps.c9d0l4o7y2h5y5j.j2et.p1.openshiftapps.com
    

---
# Source: showroom-single-pod/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: showroom-terminal-lab-user-home
  namespace: showroom
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"

---
# Source: showroom-single-pod/templates/terminal/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edit-showroom-sa
  namespace: showroom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
