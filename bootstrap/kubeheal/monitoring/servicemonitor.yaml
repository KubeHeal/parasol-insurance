---
# ServiceMonitor for Parasol Insurance application
# Enables Prometheus to scrape metrics from the parasol-insurance namespace,
# demonstrating cross-namespace observability for the self-healing platform.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: parasol-insurance
  namespace: parasol-insurance
  labels:
    app: parasol-insurance
    app.kubernetes.io/part-of: kubeheal-demo
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app: ic-app
  endpoints:
    - port: http
      interval: 15s
      path: /metrics
      scheme: http
      scrapeTimeout: 10s
      metricRelabelings:
        - action: replace
          sourceLabels: [__name__]
          regex: 'parasol_.*'
          targetLabel: component
          replacement: 'parasol-insurance'
  namespaceSelector:
    matchNames:
      - parasol-insurance
