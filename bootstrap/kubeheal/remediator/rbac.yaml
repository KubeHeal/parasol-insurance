apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: parasol-remediator
  namespace: parasol-insurance
  labels:
    app.kubernetes.io/part-of: kubeheal-demo
    app.kubernetes.io/component: remediator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: parasol-remediator
  namespace: parasol-insurance
  labels:
    app.kubernetes.io/part-of: kubeheal-demo
    app.kubernetes.io/component: remediator
subjects:
  - kind: ServiceAccount
    name: parasol-remediator
    namespace: parasol-insurance
roleRef:
  kind: Role
  name: parasol-remediator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: parasol-remediator-monitoring-view
  labels:
    app.kubernetes.io/part-of: kubeheal-demo
    app.kubernetes.io/component: remediator
subjects:
  - kind: ServiceAccount
    name: parasol-remediator
    namespace: parasol-insurance
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
