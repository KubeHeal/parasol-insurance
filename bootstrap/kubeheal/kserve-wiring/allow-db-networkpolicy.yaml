---
# Postgres is its own policy so a chaos step can remove the path to
# claimdb:5432. NetworkPolicies are additive: a second policy cannot
# revoke an allow that still selects ic-app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ic-app-to-claimdb
  namespace: parasol-insurance
  labels:
    app: parasol-insurance
    app.kubernetes.io/part-of: kubeheal-demo
spec:
  podSelector:
    matchLabels:
      app: ic-app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: claimdb
      ports:
        - protocol: TCP
          port: 5432
