---
# NetworkPolicy allowing Parasol Insurance pods to reach the KubeHeal
# platform namespace for KServe model inference (cross-namespace traffic).
#
# This proves the app and platform live in separate namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-parasol-to-platform
  namespace: parasol-insurance
  labels:
    app: parasol-insurance
    app.kubernetes.io/part-of: kubeheal-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app: ic-app
  policyTypes:
    - Egress
  egress:
    # OpenShift DNS lives in openshift-dns and answers on 5353.
    # A port-only rule does not reach it on OVN-Kubernetes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres and MinIO run in this namespace (ROSA overlay).
    - to:
        - podSelector: {}
    # Allow traffic to KServe InferenceService in the platform namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: self-healing-platform
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # Model weights and container helper calls (HTTPS)
    - to: []
      ports:
        - protocol: TCP
          port: 443
