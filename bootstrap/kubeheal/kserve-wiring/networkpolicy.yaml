---
# NetworkPolicy allowing Parasol Insurance pods to reach the KubeHeal
# platform namespace for KServe model inference (cross-namespace traffic).
#
# This proves the app and platform live in separate namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-parasol-to-platform
  namespace: parasol-insurance
  labels:
    app: parasol-insurance
    app.kubernetes.io/part-of: kubeheal-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app: ic-app
  policyTypes:
    - Egress
  egress:
    # OpenShift DNS lives in openshift-dns and answers on 5353.
    # A port-only rule does not reach it on OVN-Kubernetes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-namespace endpoints the app calls. Postgres is allow-ic-app-to-claimdb
    # so a chaos step can remove that path without opening every port.
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: milvus
      ports:
        - protocol: TCP
          port: 19530
    # qwen-predictor Service port is 80 and the container port is 8080.
    # OVN matches the port the client uses, so both stay open.
    - to:
        - podSelector:
            matchLabels:
              app: isvc.qwen-predictor
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # Allow traffic to KServe InferenceService in the platform namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: self-healing-platform
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # Model weights and container helper calls (HTTPS)
    - to: []
      ports:
        - protocol: TCP
          port: 443
